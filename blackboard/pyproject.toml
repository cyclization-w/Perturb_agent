[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboard-agent"
version = "1.0.0"
description = "LLM-driven scientific analysis with typed provenance memory"
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]
optional-dependencies = { openai = ["openai>=1.0"], anthropic = ["anthropic>=0.30"], server = ["fastapi", "uvicorn"], notebook = ["nbformat"], kernel = ["jupyter_client", "ipykernel"] }

[project.scripts]
blackboard = "blackboard._cli:main"

[tool.setuptools.packages.find]
include = ["blackboard*"]
